<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Snake & Ladder | Premium Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="theme-royal">
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>Royal <span>Snake & Ladder</span></h1>
                <div class="header-controls">
                    <select id="players-select">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                    </select>
                    <select id="theme-select">
                        <option value="theme-royal">Royal Night</option>
                        <option value="theme-emerald">Emerald Forest</option>
                        <option value="theme-ocean">Midnight Ocean</option>
                        <option value="theme-sunset">Sunset Gold</option>
                    </select>
                </div>
            </div>
            <p>Master the board, dodge the snakes!</p>
        </header>

        <main>
            <div class="game-layout">
                <!-- Game Board Section -->
                <div class="board-container">
                    <div id="board" class="board">
                        <!-- Cells will be generated by JS -->
                    </div>
                    <svg id="snakes-ladders-svg" class="overlay-svg"></svg>
                    <div id="tokens-container"></div>
                </div>

                <!-- Controls & Info Section -->
                <aside class="game-controls">
                    <div class="status-card glass">
                        <h3>Player Turn</h3>
                        <div id="current-player-info" class="player-info">
                            <div class="player-avatar" id="active-player-avatar"></div>
                            <span id="active-player-name">Waiting...</span>
                        </div>
                    </div>

                    <div class="dice-section glass">
                        <div id="dice" class="dice">
                            <div class="face front"></div>
                            <div class="face back"></div>
                            <div class="face right"></div>
                            <div class="face left"></div>
                            <div class="face top"></div>
                            <div class="face bottom"></div>
                        </div>
                        <button id="roll-btn" class="primary-btn">Roll Dice</button>
                    </div>

                    <div class="players-list glass">
                        <h3>Players</h3>
                        <div id="players-container">
                            <!-- Players list will be populated by JS -->
                        </div>
                    </div>

                    <div class="game-logs glass">
                        <h3>Activity Feed</h3>
                        <div id="logs" class="logs">
                            <div class="log-entry">Welcome to the game!</div>
                        </div>
                    </div>
                </aside>
            </div>
        </main>

        <footer class="app-footer">
            <p>Powered by <span class="brand-name">Null Magnet</span></p>
        </footer>

        <div id="win-modal" class="modal hidden">
            <div class="modal-content glass">
                <h2 id="winner-name">Player 1 Wins!</h2>
                <p>Congratulations on your victory!</p>
                <button id="restart-btn" class="primary-btn">Play Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
